<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Orb Chain</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a2a; touch-action: none; }
    #stage { position: fixed; inset: 0; will-change: transform; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 2; }
    .hud {
      position: fixed; top: 1rem; left: 0; right: 0; text-align: center; z-index: 3;
      font: 800 2rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45); pointer-events: none;
      transform-origin: 50% 50%;
    }
    .float-score {
      position: fixed; z-index: 4; pointer-events: none;
      font: 800 1.15rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="hud" id="score">0</div>
  <script src="/lib/gsap.min.js"></script>
  <script src="/lib/proton.min.js"></script>
  <script src="/lib/juice.js"></script>
  <script src="/lib/playful.js"></script>
  <script>

    const GS = {
      paused: true,
      started: false,
      reported: false,
      onFail: 'replay',
      post(type, extra) {
        try { parent.postMessage(Object.assign({ type }, extra || {}), '*') } catch (e) {}
      },
      begin(msg) {
        const fail = msg && msg.onFail
        if (fail === 'gameover' || fail === 'replay') GS.onFail = fail
        if (!GS.reported) { GS.reported = true; GS.post('gamescroll:playing') }
        const forceReset = !!(msg && msg.forceReset)
        const resuming = GS.started && GS.paused && !forceReset
        GS.paused = false
        GS.started = true
        if (!resuming && typeof onHostStart === 'function') onHostStart()
      },
      halt() {
        GS.paused = true
        if (typeof onHostPause === 'function') onHostPause()
      }
    }
    addEventListener('message', (e) => {
      const t = e.data && e.data.type
      if (t === 'gamescroll:start') GS.begin(e.data)
      if (t === 'gamescroll:pause') GS.halt()
    })
    // Forward committed vertical flings to the host so swiping between games
    // works even though this iframe captures all pointer events. Thresholds are
    // high (long + fast + steep) so in-game taps, drags and short swipes never
    // trigger navigation.
    ;(function () {
      let sx = 0, sy = 0, st = 0, tracking = false
      addEventListener('pointerdown', (e) => {
        sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true
      }, true)
      addEventListener('pointerup', (e) => {
        if (!tracking) return
        tracking = false
        const dx = Math.abs(e.clientX - sx)
        const dy = e.clientY - sy
        const dt = performance.now() - st
        const minDist = Math.max(140, innerHeight * 0.22)
        if (dt > 350 || Math.abs(dy) < minDist || Math.abs(dy) < dx * 2.2) return
        GS.post(dy < 0 ? 'gamescroll:swipe-next' : 'gamescroll:swipe-prev')
      }, true)
      addEventListener('pointercancel', () => { tracking = false }, true)
    })()
    GS.post('gamescroll:ready')

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const scoreEl = document.getElementById('score')
    const dpr = Math.min(devicePixelRatio || 1, 2)
    let W = 0, H = 0, score = 0, last = performance.now()
    function setScore(n) { score = Math.max(0, n|0); scoreEl.textContent = String(score) }
    function reportScore() {
      if (score > 0) {
        try { parent.postMessage({ type: 'gamescroll:score', score }, '*') } catch (e) {}
      }
    }
    function bump(n) {
      const amount = n || 1
      setScore(score + amount)
      if (window.Juice) {
        const pos = typeof scorePos === 'function' ? scorePos() : null
        if (pos) Juice.onScore(amount, pos[0], pos[1])
        else Juice.onScore(amount)
      }
    }
    function resize() {
      W = innerWidth; H = innerHeight
      canvas.width = W * dpr; canvas.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      if (window.Juice) Juice.resize()
    }
    addEventListener('resize', () => { resize(); if (typeof onResize === 'function') onResize() })
    resize()
    if (window.Juice) Juice.init({ accent: "#22ddff" })

    let cols = 5, rows = 7, board = [], ox = 0, oy = 0, cell = 0, gap = 4
    let turn = 1, exploding = false, boomQ = [], boomT = 0
    function layout() {
      const pad = 14
      const sideW = W - pad * 2
      const sideH = H * 0.72
      cell = Math.min((sideW - gap * (cols - 1)) / cols, (sideH - gap * (rows - 1)) / rows)
      ox = (W - (cell * cols + gap * (cols - 1))) * 0.5
      oy = H * 0.14
    }
    function onResize() { layout() }
    function diePos() { return [W * 0.5, oy + cell * 3] }
    function scorePos() { return diePos() }
    function cap(i) {
      const c = i % cols, r = (i / cols) | 0
      let e = 0
      if (c === 0 || c === cols - 1) e++
      if (r === 0 || r === rows - 1) e++
      if (e >= 2) return 2
      if (e === 1) return 3
      return 4
    }
    function neighbors(i) {
      const c = i % cols, r = (i / cols) | 0, out = []
      if (r > 0) out.push(i - cols)
      if (r < rows - 1) out.push(i + cols)
      if (c > 0) out.push(i - 1)
      if (c < cols - 1) out.push(i + 1)
      return out
    }
    function reset() {
      layout()
      board = Array.from({ length: cols * rows }, () => ({ owner: 0, orbs: 0 }))
      turn = 1
      exploding = false
      boomQ = []
      boomT = 0
      setScore(0)
    }
    function onHostStart() { reset() }
    function die() { reset() }
    function countOwner(o) {
      let n = 0
      for (const c of board) if (c.owner === o) n += c.orbs
      return n
    }
    function checkWin() {
      const p1 = board.some(c => c.owner === 1)
      const p2 = board.some(c => c.owner === 2)
      if (p1 && !p2) {
        bump(50)
        die()
        return true
      }
      if (p2 && !p1) {
        die()
        return true
      }
      return false
    }
    function enqueueUnstable() {
      for (let i = 0; i < board.length; i++) {
        if (board[i].orbs >= cap(i)) boomQ.push(i)
      }
    }
    function stepBoom() {
      if (!boomQ.length) {
        exploding = false
        if (checkWin()) return
        if (turn === 2) aiMove()
        return
      }
      const uniq = [...new Set(boomQ)]
      boomQ = []
      for (const i of uniq) {
        const cellB = board[i]
        if (cellB.orbs < cap(i)) continue
        const owner = cellB.owner
        cellB.orbs -= cap(i)
        if (cellB.orbs <= 0) { cellB.orbs = 0; cellB.owner = 0 }
        for (const n of neighbors(i)) {
          board[n].owner = owner
          board[n].orbs++
          if (board[n].orbs >= cap(n)) boomQ.push(n)
        }
        if (owner === 1) bump(1)
      }
      boomT = 0.16
    }
    function place(i, owner) {
      const c = board[i]
      if (c.owner && c.owner !== owner) return false
      c.owner = owner
      c.orbs++
      exploding = true
      boomQ = []
      enqueueUnstable()
      boomT = 0.05
      turn = owner === 1 ? 2 : 1
      return true
    }
    function aiMove() {
      const opts = []
      for (let i = 0; i < board.length; i++) {
        if (!board[i].owner || board[i].owner === 2) opts.push(i)
      }
      if (!opts.length) return
      // prefer near-capacity own cells, else random empty
      opts.sort((a, b) => {
        const sa = board[a].owner === 2 ? board[a].orbs / cap(a) : 0
        const sb = board[b].owner === 2 ? board[b].orbs / cap(b) : 0
        return sb - sa
      })
      const pick = opts[(Math.random() * Math.min(3, opts.length)) | 0]
      place(pick, 2)
    }
    function tick(dt) {
      if (!exploding) return
      boomT -= dt
      if (boomT <= 0) stepBoom()
    }
    function draw() {
      PF.sky(ctx, W, H, '#040414', '#0a0a2a', '#151545')
      PF.dots(ctx, W, H, '#22ddff', 12, 0.3)
      for (let i = 0; i < board.length; i++) {
        const c = i % cols, r = (i / cols) | 0
        const x = ox + c * (cell + gap)
        const y = oy + r * (cell + gap)
        PF.block(ctx, x, y, cell, cell, '#12122a', '#080818', 8)
        const b = board[i]
        if (!b.orbs) continue
        const col = b.owner === 1 ? '#22ddff' : '#ff3344'
        for (let k = 0; k < b.orbs; k++) {
          const ang = (k / Math.max(1, b.orbs)) * Math.PI * 2
          const rr = b.orbs === 1 ? 0 : cell * 0.18
          ctx.fillStyle = col
          ctx.beginPath()
          ctx.arc(x + cell * 0.5 + Math.cos(ang) * rr, y + cell * 0.5 + Math.sin(ang) * rr, cell * 0.12, 0, Math.PI * 2)
          ctx.fill()
        }
      }
      ctx.fillStyle = 'rgba(255,255,255,0.75)'
      ctx.font = '700 13px "Segoe UI", sans-serif'
      ctx.fillText(exploding ? 'Chain…' : (turn === 1 ? 'Your turn' : 'CPU…'), 14, 28)
    }
    addEventListener('pointerdown', e => {
      if (GS.paused || exploding || turn !== 1) return
      const r = canvas.getBoundingClientRect()
      const x = e.clientX - r.left
      const y = e.clientY - r.top
      const c = Math.floor((x - ox) / (cell + gap))
      const row = Math.floor((y - oy) / (cell + gap))
      if (c < 0 || row < 0 || c >= cols || row >= rows) return
      const i = row * cols + c
      if (board[i].owner === 2) return
      place(i, 1)
    })
    reset()

    if (typeof layout === 'function') {
      try { layout() } catch (e) { console.error('[gamescroll] layout()', e) }
    }
    ;(function () {
      const __halt = GS.halt
      GS.halt = function () {
        reportScore()
        __halt()
      }
    })()
    if (typeof die === 'function') {
      const __die = die
      die = function () {
        if (GS.paused) return
        reportScore()
        if (window.Juice) {
          const pos = typeof diePos === 'function' ? diePos() : null
          if (pos) Juice.onDie(pos[0], pos[1])
          else Juice.onDie()
        }
        if (GS.onFail === 'gameover') {
          GS.post('gamescroll:died', { score })
          GS.halt()
          return
        }
        __die()
      }
    }
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000)
      last = now
      try {
        if (window.PF) PF.t += dt
        if (!GS.paused && typeof tick === 'function') tick(dt)
        if (typeof draw === 'function') draw(now)
        if (window.Juice) Juice.update()
      } catch (err) {
        console.error('[gamescroll]', err)
      }
      requestAnimationFrame(loop)
    }
    requestAnimationFrame(loop)
  </script>
</body>
</html>
