<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Mine Sweep</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2838; touch-action: none; }
    #stage { position: fixed; inset: 0; will-change: transform; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 2; }
    .hud {
      position: fixed; top: 1rem; left: 0; right: 0; text-align: center; z-index: 3;
      font: 800 2rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45); pointer-events: none;
      transform-origin: 50% 50%;
    }
    .float-score {
      position: fixed; z-index: 4; pointer-events: none;
      font: 800 1.15rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="hud" id="score">0</div>
  <script src="/lib/gsap.min.js"></script>
  <script src="/lib/proton.min.js"></script>
  <script src="/lib/juice.js"></script>
  <script src="/lib/playful.js"></script>
  <script>

    const GS = {
      paused: true,
      reported: false,
      onFail: 'replay',
      post(type, extra) {
        try { parent.postMessage(Object.assign({ type }, extra || {}), '*') } catch (e) {}
      },
      begin(msg) {
        const fail = msg && msg.onFail
        if (fail === 'gameover' || fail === 'replay') GS.onFail = fail
        if (!GS.reported) { GS.reported = true; GS.post('gamescroll:playing') }
        GS.paused = false
        if (typeof onHostStart === 'function') onHostStart()
      },
      halt() {
        GS.paused = true
        if (typeof onHostPause === 'function') onHostPause()
      }
    }
    addEventListener('message', (e) => {
      const t = e.data && e.data.type
      if (t === 'gamescroll:start') GS.begin(e.data)
      if (t === 'gamescroll:pause') GS.halt()
    })
    // Forward committed vertical flings to the host so swiping between games
    // works even though this iframe captures all pointer events. Thresholds are
    // high (long + fast + steep) so in-game taps, drags and short swipes never
    // trigger navigation.
    ;(function () {
      let sx = 0, sy = 0, st = 0, tracking = false
      addEventListener('pointerdown', (e) => {
        sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true
      }, true)
      addEventListener('pointerup', (e) => {
        if (!tracking) return
        tracking = false
        const dx = Math.abs(e.clientX - sx)
        const dy = e.clientY - sy
        const dt = performance.now() - st
        const minDist = Math.max(140, innerHeight * 0.22)
        if (dt > 350 || Math.abs(dy) < minDist || Math.abs(dy) < dx * 2.2) return
        GS.post(dy < 0 ? 'gamescroll:swipe-next' : 'gamescroll:swipe-prev')
      }, true)
      addEventListener('pointercancel', () => { tracking = false }, true)
    })()
    GS.post('gamescroll:ready')

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const scoreEl = document.getElementById('score')
    const dpr = Math.min(devicePixelRatio || 1, 2)
    let W = 0, H = 0, score = 0, last = performance.now()
    function setScore(n) { score = Math.max(0, n|0); scoreEl.textContent = String(score) }
    function reportScore() {
      if (score > 0) {
        try { parent.postMessage({ type: 'gamescroll:score', score }, '*') } catch (e) {}
      }
    }
    function bump(n) {
      const amount = n || 1
      setScore(score + amount)
      if (window.Juice) {
        const pos = typeof scorePos === 'function' ? scorePos() : null
        if (pos) Juice.onScore(amount, pos[0], pos[1])
        else Juice.onScore(amount)
      }
    }
    function resize() {
      W = innerWidth; H = innerHeight
      canvas.width = W * dpr; canvas.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      if (window.Juice) Juice.resize()
    }
    addEventListener('resize', () => { resize(); if (typeof onResize === 'function') onResize() })
    resize()
    if (window.Juice) Juice.init({ accent: "#66c0f4" })

    let cols = 9, rows = 9, mines = 10
    let board = [], revealed = [], flagged = [], ox = 0, oy = 0, cell = 0
    let ready = false, boom = false, won = false, holdT = 0, holdCell = null, pressId = 0
    function layout() {
      const pad = 16
      cell = Math.floor(Math.min((W - pad * 2) / cols, (H * 0.7) / rows))
      ox = (W - cell * cols) * 0.5
      oy = H * 0.18
    }
    function onResize() { layout() }
    function diePos() { return [W * 0.5, oy + cell * rows * 0.5] }
    function scorePos() { return diePos() }
    function idx(r, c) { return r * cols + c }
    function neighbors(r, c) {
      const out = []
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue
        const rr = r + dr, cc = c + dc
        if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) out.push([rr, cc])
      }
      return out
    }
    function placeMines(sr, sc) {
      board = Array(rows * cols).fill(0)
      let left = mines
      while (left > 0) {
        const r = (Math.random() * rows) | 0
        const c = (Math.random() * cols) | 0
        if (Math.abs(r - sr) <= 1 && Math.abs(c - sc) <= 1) continue
        const i = idx(r, c)
        if (board[i] === -1) continue
        board[i] = -1
        left--
      }
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        if (board[idx(r, c)] === -1) continue
        board[idx(r, c)] = neighbors(r, c).filter(([rr, cc]) => board[idx(rr, cc)] === -1).length
      }
      ready = true
    }
    function flood(r, c) {
      const stack = [[r, c]]
      while (stack.length) {
        const [rr, cc] = stack.pop()
        const i = idx(rr, cc)
        if (revealed[i] || flagged[i]) continue
        revealed[i] = true
        if (board[i] === 0) {
          for (const n of neighbors(rr, cc)) stack.push(n)
        }
      }
    }
    function checkWin() {
      let hidden = 0
      for (let i = 0; i < board.length; i++) if (!revealed[i]) hidden++
      if (hidden === mines) {
        won = true
        bump(250)
        if (window.Juice) Juice.burst(W * 0.5, oy + cell * rows * 0.5)
        die()
      }
    }
    function reset() {
      layout()
      board = Array(rows * cols).fill(0)
      revealed = Array(rows * cols).fill(false)
      flagged = Array(rows * cols).fill(false)
      ready = false; boom = false; won = false
      holdT = 0; holdCell = null
      setScore(0)
    }
    function onHostStart() { reset() }
    function die() { reset() }
    function tick(dt) {
      if (!holdCell || GS.paused) return
      holdT += dt
      if (holdT >= 0.45) {
        const [r, c] = holdCell
        const i = idx(r, c)
        if (!revealed[i]) {
          flagged[i] = !flagged[i]
          if (window.Juice) Juice.burst(ox + (c + 0.5) * cell, oy + (r + 0.5) * cell)
        }
        holdCell = null
        holdT = 0
        pressId++
      }
    }
    function cellAt(e) {
      const rect = canvas.getBoundingClientRect()
      const x = e.clientX - rect.left
      const y = e.clientY - rect.top
      const c = Math.floor((x - ox) / cell)
      const r = Math.floor((y - oy) / cell)
      if (r < 0 || c < 0 || r >= rows || c >= cols) return null
      return [r, c]
    }
    function dig(r, c) {
      if (flagged[idx(r, c)]) return
      if (!ready) placeMines(r, c)
      const i = idx(r, c)
      if (revealed[i]) return
      if (board[i] === -1) {
        boom = true
        revealed[i] = true
        die()
        return
      }
      flood(r, c)
      bump(1)
      checkWin()
    }
    function draw() {
      PF.sky(ctx, W, H, '#0b1520', '#1b2838', '#2a475e')
      PF.dots(ctx, W, H, '#66c0f4', 14, 0.35)
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const i = idx(r, c)
        const x = ox + c * cell, y = oy + r * cell
        if (revealed[i]) {
          PF.block(ctx, x + 1, y + 1, cell - 2, cell - 2, '#c7d5e0', '#8b9bb4', 4)
          if (board[i] === -1) {
            ctx.fillStyle = '#e74c3c'
            ctx.beginPath()
            ctx.arc(x + cell * 0.5, y + cell * 0.5, cell * 0.22, 0, Math.PI * 2)
            ctx.fill()
          } else if (board[i] > 0) {
            const colsN = ['#3498db', '#2ecc71', '#e74c3c', '#9b59b6', '#f39c12', '#1abc9c', '#34495e', '#e67e22']
            ctx.fillStyle = colsN[board[i] - 1]
            ctx.font = '800 ' + Math.floor(cell * 0.45) + 'px "Segoe UI", sans-serif'
            ctx.textAlign = 'center'
            ctx.textBaseline = 'middle'
            ctx.fillText(String(board[i]), x + cell * 0.5, y + cell * 0.52)
          }
        } else {
          PF.block(ctx, x + 1, y + 1, cell - 2, cell - 2, '#4a6a8a', '#2a475e', 4)
          if (flagged[i]) {
            ctx.fillStyle = '#e74c3c'
            ctx.font = '800 ' + Math.floor(cell * 0.4) + 'px "Segoe UI", sans-serif'
            ctx.textAlign = 'center'
            ctx.textBaseline = 'middle'
            ctx.fillText('▲', x + cell * 0.5, y + cell * 0.52)
          }
        }
      }
      ctx.textAlign = 'left'
      ctx.textBaseline = 'alphabetic'
      ctx.fillStyle = 'rgba(255,255,255,0.7)'
      ctx.font = '700 13px "Segoe UI", sans-serif'
      ctx.fillText('Flags ' + flagged.filter(Boolean).length + '/' + mines, 14, 28)
    }
    addEventListener('pointerdown', e => {
      if (GS.paused || boom || won) return
      const cellHit = cellAt(e)
      if (!cellHit) return
      holdCell = cellHit
      holdT = 0
      pressId++
      const my = pressId
      // short tap digs on pointerup if hold didn't flag
      const up = (ev) => {
        removeEventListener('pointerup', up)
        removeEventListener('pointercancel', up)
        if (my !== pressId) return
        if (holdCell) {
          dig(holdCell[0], holdCell[1])
          holdCell = null
          holdT = 0
        }
      }
      addEventListener('pointerup', up)
      addEventListener('pointercancel', up)
    })
    reset()

    if (typeof layout === 'function') {
      try { layout() } catch (e) { console.error('[gamescroll] layout()', e) }
    }
    ;(function () {
      const __halt = GS.halt
      GS.halt = function () {
        reportScore()
        __halt()
      }
    })()
    if (typeof die === 'function') {
      const __die = die
      die = function () {
        if (GS.paused) return
        reportScore()
        if (window.Juice) {
          const pos = typeof diePos === 'function' ? diePos() : null
          if (pos) Juice.onDie(pos[0], pos[1])
          else Juice.onDie()
        }
        if (GS.onFail === 'gameover') {
          GS.post('gamescroll:died', { score })
          GS.halt()
          return
        }
        __die()
      }
    }
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000)
      last = now
      try {
        if (window.PF) PF.t += dt
        if (!GS.paused && typeof tick === 'function') tick(dt)
        if (typeof draw === 'function') draw(now)
        if (window.Juice) Juice.update()
      } catch (err) {
        console.error('[gamescroll]', err)
      }
      requestAnimationFrame(loop)
    }
    requestAnimationFrame(loop)
  </script>
</body>
</html>
