<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Math Rush</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b2420; touch-action: none; }
    #stage { position: fixed; inset: 0; will-change: transform; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 2; }
    .hud {
      position: fixed; top: 1rem; left: 0; right: 0; text-align: center; z-index: 3;
      font: 800 2rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45); pointer-events: none;
      transform-origin: 50% 50%;
    }
    .float-score {
      position: fixed; z-index: 4; pointer-events: none;
      font: 800 1.15rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="hud" id="score">0</div>
  <script src="/lib/gsap.min.js"></script>
  <script src="/lib/proton.min.js"></script>
  <script src="/lib/juice.js"></script>
  <script src="/lib/playful.js"></script>
  <script>

    const GS = {
      paused: true,
      started: false,
      reported: false,
      onFail: 'replay',
      post(type, extra) {
        try { parent.postMessage(Object.assign({ type }, extra || {}), '*') } catch (e) {}
      },
      begin(msg) {
        const fail = msg && msg.onFail
        if (fail === 'gameover' || fail === 'replay') GS.onFail = fail
        if (!GS.reported) { GS.reported = true; GS.post('gamescroll:playing') }
        const forceReset = !!(msg && msg.forceReset)
        const resuming = GS.started && GS.paused && !forceReset
        GS.paused = false
        GS.started = true
        if (!resuming && typeof onHostStart === 'function') onHostStart()
      },
      halt() {
        GS.paused = true
        if (typeof onHostPause === 'function') onHostPause()
      }
    }
    addEventListener('message', (e) => {
      const t = e.data && e.data.type
      if (t === 'gamescroll:start') GS.begin(e.data)
      if (t === 'gamescroll:pause') GS.halt()
    })
    // Forward committed vertical flings to the host so swiping between games
    // works even though this iframe captures all pointer events. Thresholds are
    // high (long + fast + steep) so in-game taps, drags and short swipes never
    // trigger navigation.
    ;(function () {
      let sx = 0, sy = 0, st = 0, tracking = false
      addEventListener('pointerdown', (e) => {
        sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true
      }, true)
      addEventListener('pointerup', (e) => {
        if (!tracking) return
        tracking = false
        const dx = Math.abs(e.clientX - sx)
        const dy = e.clientY - sy
        const dt = performance.now() - st
        const minDist = Math.max(140, innerHeight * 0.22)
        if (dt > 350 || Math.abs(dy) < minDist || Math.abs(dy) < dx * 2.2) return
        GS.post(dy < 0 ? 'gamescroll:swipe-next' : 'gamescroll:swipe-prev')
      }, true)
      addEventListener('pointercancel', () => { tracking = false }, true)
    })()
    GS.post('gamescroll:ready')

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const scoreEl = document.getElementById('score')
    const dpr = Math.min(devicePixelRatio || 1, 2)
    let W = 0, H = 0, score = 0, last = performance.now()
    function setScore(n) { score = Math.max(0, n|0); scoreEl.textContent = String(score) }
    function reportScore() {
      if (score > 0) {
        try { parent.postMessage({ type: 'gamescroll:score', score }, '*') } catch (e) {}
      }
    }
    function bump(n) {
      const amount = n || 1
      setScore(score + amount)
      if (window.Juice) {
        const pos = typeof scorePos === 'function' ? scorePos() : null
        if (pos) Juice.onScore(amount, pos[0], pos[1])
        else Juice.onScore(amount)
      }
    }
    function resize() {
      W = innerWidth; H = innerHeight
      canvas.width = W * dpr; canvas.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      if (window.Juice) Juice.resize()
    }
    addEventListener('resize', () => { resize(); if (typeof onResize === 'function') onResize() })
    resize()
    if (window.Juice) Juice.init({ accent: "#5eead4" })

    const ROUND = 20
    let timeLeft = ROUND, running = false, prompt = '', answer = 0
    let choices = [], pads = [], flashI = -1, flashT = 0, flashOk = false
    let qBox = { x: 0, y: 0, w: 0, h: 0 }
    function randInt(a, b) { return a + ((Math.random() * (b - a + 1)) | 0) }
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t
      }
      return arr
    }
    function makeQuestion() {
      const kind = (Math.random() * 3) | 0
      let a, b, ans, text
      if (kind === 0) {
        a = randInt(1, 12); b = randInt(1, 12); ans = a + b; text = a + ' + ' + b
      } else if (kind === 1) {
        a = randInt(5, 20); b = randInt(1, a); ans = a - b; text = a + ' − ' + b
      } else {
        a = randInt(2, 9); b = randInt(2, 9); ans = a * b; text = a + ' × ' + b
      }
      const set = new Set([ans])
      while (set.size < 4) {
        const delta = randInt(1, 6) * (Math.random() < 0.5 ? -1 : 1)
        const wrong = ans + delta
        if (wrong !== ans && wrong >= 0) set.add(wrong)
      }
      prompt = text
      answer = ans
      choices = shuffle(Array.from(set))
      layoutPads()
    }
    function layoutPads() {
      const gap = 12
      const side = Math.min(W - 36, H * 0.42)
      const padW = (side - gap) * 0.5
      const padH = Math.min(padW * 0.72, H * 0.14)
      const ox = (W - side) * 0.5
      const oy = H * 0.48
      qBox = { x: ox, y: H * 0.22, w: side, h: Math.min(H * 0.16, 88) }
      pads = []
      for (let i = 0; i < 4; i++) {
        const c = i % 2, r = (i / 2) | 0
        pads.push({
          i,
          x: ox + c * (padW + gap),
          y: oy + r * (padH + gap),
          w: padW,
          h: padH,
          v: choices[i],
        })
      }
    }
    function layout() { layoutPads() }
    function onResize() { layout() }
    function diePos() { return [W * 0.5, H * 0.4] }
    function scorePos() { return diePos() }
    function reset() {
      timeLeft = ROUND
      running = true
      flashI = -1
      flashT = 0
      flashOk = false
      setScore(0)
      makeQuestion()
    }
    function onHostStart() { reset() }
    function die() { reset() }
    function tick(dt) {
      if (flashT > 0) {
        flashT -= dt
        if (flashT <= 0) {
          flashI = -1
          if (flashOk) makeQuestion()
          else if (!running) die()
        }
      }
      if (!running || GS.paused) return
      timeLeft -= dt
      if (timeLeft <= 0) {
        timeLeft = 0
        running = false
        die()
      }
    }
    function padAt(e) {
      const r = canvas.getBoundingClientRect()
      const x = e.clientX - r.left
      const y = e.clientY - r.top
      for (const p of pads) {
        if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return p
      }
      return null
    }
    function draw() {
      PF.sky(ctx, W, H, '#041512', '#0b2420', '#134e4a')
      PF.dots(ctx, W, H, '#5eead4', 14, 0.35)
      PF.block(ctx, qBox.x, qBox.y, qBox.w, qBox.h, '#115e59', '#0f766e', 18)
      ctx.fillStyle = '#ecfdf5'
      ctx.font = '800 ' + Math.floor(Math.min(W, H) * 0.09) + 'px "Segoe UI", sans-serif'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      ctx.fillText(prompt, W * 0.5, qBox.y + qBox.h * 0.5)
      for (const p of pads) {
        const lit = flashI === p.i
        const c0 = lit ? (flashOk ? '#5eead4' : '#fb7185') : '#1a3a36'
        const c1 = lit ? (flashOk ? '#14b8a6' : '#e11d48') : '#0f2926'
        PF.block(ctx, p.x, p.y, p.w, p.h, c0, c1, 16)
        ctx.fillStyle = '#fff'
        ctx.font = '800 ' + Math.floor(Math.min(p.w, p.h) * 0.42) + 'px "Segoe UI", sans-serif'
        ctx.fillText(String(p.v), p.x + p.w * 0.5, p.y + p.h * 0.52)
      }
      ctx.textAlign = 'left'
      ctx.textBaseline = 'alphabetic'
      ctx.fillStyle = timeLeft < 5 ? '#fb7185' : 'rgba(255,255,255,0.75)'
      ctx.font = '700 14px "Segoe UI", sans-serif'
      ctx.fillText('Time ' + Math.ceil(timeLeft), 14, 28)
    }
    addEventListener('pointerdown', e => {
      if (GS.paused || !running || flashT > 0) return
      const p = padAt(e)
      if (!p) return
      flashI = p.i
      flashT = 0.22
      if (p.v === answer) {
        flashOk = true
        bump()
        if (window.Juice) Juice.burst(p.x + p.w * 0.5, p.y + p.h * 0.5)
      } else {
        flashOk = false
        running = false
        if (window.Juice) Juice.burst(W * 0.5, H * 0.4)
      }
    })
    reset()

    if (typeof layout === 'function') {
      try { layout() } catch (e) { console.error('[gamescroll] layout()', e) }
    }
    ;(function () {
      const __halt = GS.halt
      GS.halt = function () {
        reportScore()
        __halt()
      }
    })()
    if (typeof die === 'function') {
      const __die = die
      die = function () {
        if (GS.paused) return
        reportScore()
        if (window.Juice) {
          const pos = typeof diePos === 'function' ? diePos() : null
          if (pos) Juice.onDie(pos[0], pos[1])
          else Juice.onDie()
        }
        if (GS.onFail === 'gameover') {
          GS.post('gamescroll:died', { score })
          GS.halt()
          return
        }
        __die()
      }
    }
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000)
      last = now
      try {
        if (window.PF) PF.t += dt
        if (!GS.paused && typeof tick === 'function') tick(dt)
        if (typeof draw === 'function') draw(now)
        if (window.Juice) Juice.update()
      } catch (err) {
        console.error('[gamescroll]', err)
      }
      requestAnimationFrame(loop)
    }
    requestAnimationFrame(loop)
  </script>
</body>
</html>
