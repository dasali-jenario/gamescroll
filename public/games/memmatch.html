<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Memory Match</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2d1b4e; touch-action: none; }
    #stage { position: fixed; inset: 0; will-change: transform; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 2; }
    .hud {
      position: fixed; top: 1rem; left: 0; right: 0; text-align: center; z-index: 3;
      font: 800 2rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45); pointer-events: none;
      transform-origin: 50% 50%;
    }
    .float-score {
      position: fixed; z-index: 4; pointer-events: none;
      font: 800 1.15rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="hud" id="score">0</div>
  <script src="/lib/gsap.min.js"></script>
  <script src="/lib/proton.min.js"></script>
  <script src="/lib/juice.js"></script>
  <script src="/lib/playful.js"></script>
  <script>

    const GS = {
      paused: true,
      reported: false,
      onFail: 'replay',
      post(type, extra) {
        try { parent.postMessage(Object.assign({ type }, extra || {}), '*') } catch (e) {}
      },
      begin(msg) {
        const fail = msg && msg.onFail
        if (fail === 'gameover' || fail === 'replay') GS.onFail = fail
        if (!GS.reported) { GS.reported = true; GS.post('gamescroll:playing') }
        GS.paused = false
        if (typeof onHostStart === 'function') onHostStart()
      },
      halt() {
        GS.paused = true
        if (typeof onHostPause === 'function') onHostPause()
      }
    }
    addEventListener('message', (e) => {
      const t = e.data && e.data.type
      if (t === 'gamescroll:start') GS.begin(e.data)
      if (t === 'gamescroll:pause') GS.halt()
    })
    // Forward committed vertical flings to the host so swiping between games
    // works even though this iframe captures all pointer events. Thresholds are
    // high (long + fast + steep) so in-game taps, drags and short swipes never
    // trigger navigation.
    ;(function () {
      let sx = 0, sy = 0, st = 0, tracking = false
      addEventListener('pointerdown', (e) => {
        sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true
      }, true)
      addEventListener('pointerup', (e) => {
        if (!tracking) return
        tracking = false
        const dx = Math.abs(e.clientX - sx)
        const dy = e.clientY - sy
        const dt = performance.now() - st
        const minDist = Math.max(140, innerHeight * 0.22)
        if (dt > 350 || Math.abs(dy) < minDist || Math.abs(dy) < dx * 2.2) return
        GS.post(dy < 0 ? 'gamescroll:swipe-next' : 'gamescroll:swipe-prev')
      }, true)
      addEventListener('pointercancel', () => { tracking = false }, true)
    })()
    GS.post('gamescroll:ready')

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const scoreEl = document.getElementById('score')
    const dpr = Math.min(devicePixelRatio || 1, 2)
    let W = 0, H = 0, score = 0, last = performance.now()
    function setScore(n) { score = Math.max(0, n|0); scoreEl.textContent = String(score) }
    function reportScore() {
      if (score > 0) {
        try { parent.postMessage({ type: 'gamescroll:score', score }, '*') } catch (e) {}
      }
    }
    function bump(n) {
      const amount = n || 1
      setScore(score + amount)
      if (window.Juice) {
        const pos = typeof scorePos === 'function' ? scorePos() : null
        if (pos) Juice.onScore(amount, pos[0], pos[1])
        else Juice.onScore(amount)
      }
    }
    function resize() {
      W = innerWidth; H = innerHeight
      canvas.width = W * dpr; canvas.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      if (window.Juice) Juice.resize()
    }
    addEventListener('resize', () => { resize(); if (typeof onResize === 'function') onResize() })
    resize()
    if (window.Juice) Juice.init({ accent: "#ff6bcb" })

    let cols = 4, rows = 4, cards = [], ox = 0, oy = 0, cw = 0, ch = 0, gap = 8
    let open = [], lock = 0, matched = 0, moves = 0
    const FACES = [
      { c: '#ff6bcb', s: '◆' }, { c: '#6bcbff', s: '●' }, { c: '#ffe66d', s: '★' }, { c: '#95e1a3', s: '▲' },
      { c: '#ff8e72', s: '■' }, { c: '#c9a0ff', s: '✚' }, { c: '#7bed9f', s: '◉' }, { c: '#70a1ff', s: '✦' },
    ]
    function layout() {
      const pad = 16
      const side = Math.min(W - pad * 2, H * 0.7)
      gap = 8
      cw = (side - gap * (cols + 1)) / cols
      ch = (side - gap * (rows + 1)) / rows
      ox = (W - (cw * cols + gap * (cols + 1))) * 0.5
      oy = H * 0.16
    }
    function onResize() { layout() }
    function diePos() { return [W * 0.5, oy + ch * 2] }
    function scorePos() { return diePos() }
    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0
        const t = a[i]; a[i] = a[j]; a[j] = t
      }
      return a
    }
    function reset() {
      layout()
      const deck = []
      for (let i = 0; i < 8; i++) {
        deck.push({ face: i, open: false, done: false })
        deck.push({ face: i, open: false, done: false })
      }
      cards = shuffle(deck)
      open = []; lock = 0; matched = 0; moves = 0
      setScore(0)
    }
    function onHostStart() { reset() }
    function die() { reset() }
    function tick(dt) {
      if (lock <= 0) return
      lock -= dt
      if (lock > 0) return
      for (const i of open) {
        if (!cards[i].done) cards[i].open = false
      }
      open = []
    }
    function cardAt(e) {
      const rect = canvas.getBoundingClientRect()
      const x = e.clientX - rect.left
      const y = e.clientY - rect.top
      for (let i = 0; i < cards.length; i++) {
        const r = (i / cols) | 0, c = i % cols
        const cx = ox + gap + c * (cw + gap)
        const cy = oy + gap + r * (ch + gap)
        if (x >= cx && x <= cx + cw && y >= cy && y <= cy + ch) return i
      }
      return -1
    }
    function draw() {
      PF.sky(ctx, W, H, '#1a0f2e', '#2d1b4e', '#4a2c7a')
      PF.dots(ctx, W, H, '#ff6bcb', 16, 0.4)
      for (let i = 0; i < cards.length; i++) {
        const r = (i / cols) | 0, c = i % cols
        const x = ox + gap + c * (cw + gap)
        const y = oy + gap + r * (ch + gap)
        const card = cards[i]
        if (card.done || card.open) {
          const f = FACES[card.face]
          PF.block(ctx, x, y, cw, ch, f.c, '#222', 10)
          ctx.fillStyle = '#fff'
          ctx.font = '800 ' + Math.floor(Math.min(cw, ch) * 0.42) + 'px "Segoe UI", sans-serif'
          ctx.textAlign = 'center'
          ctx.textBaseline = 'middle'
          ctx.fillText(f.s, x + cw * 0.5, y + ch * 0.52)
        } else {
          PF.block(ctx, x, y, cw, ch, '#5a3d8a', '#3a2460', 10)
          ctx.fillStyle = 'rgba(255,255,255,0.35)'
          ctx.font = '800 ' + Math.floor(Math.min(cw, ch) * 0.35) + 'px "Segoe UI", sans-serif'
          ctx.textAlign = 'center'
          ctx.textBaseline = 'middle'
          ctx.fillText('?', x + cw * 0.5, y + ch * 0.52)
        }
      }
      ctx.textAlign = 'left'
      ctx.textBaseline = 'alphabetic'
    }
    addEventListener('pointerdown', e => {
      if (GS.paused || lock > 0) return
      const i = cardAt(e)
      if (i < 0) return
      const card = cards[i]
      if (card.open || card.done) return
      card.open = true
      open.push(i)
      if (open.length < 2) return
      moves++
      const a = cards[open[0]], b = cards[open[1]]
      if (a.face === b.face) {
        a.done = b.done = true
        matched++
        bump(10)
        if (window.Juice) Juice.burst(W * 0.5, oy + ch * 2)
        open = []
        if (matched >= 8) {
          bump(Math.max(20, 120 - moves * 2))
          die()
        }
      } else {
        lock = 0.7
      }
    })
    reset()

    if (typeof layout === 'function') {
      try { layout() } catch (e) { console.error('[gamescroll] layout()', e) }
    }
    ;(function () {
      const __halt = GS.halt
      GS.halt = function () {
        reportScore()
        __halt()
      }
    })()
    if (typeof die === 'function') {
      const __die = die
      die = function () {
        if (GS.paused) return
        reportScore()
        if (window.Juice) {
          const pos = typeof diePos === 'function' ? diePos() : null
          if (pos) Juice.onDie(pos[0], pos[1])
          else Juice.onDie()
        }
        if (GS.onFail === 'gameover') {
          GS.post('gamescroll:died', { score })
          GS.halt()
          return
        }
        __die()
      }
    }
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000)
      last = now
      try {
        if (window.PF) PF.t += dt
        if (!GS.paused && typeof tick === 'function') tick(dt)
        if (typeof draw === 'function') draw(now)
        if (window.Juice) Juice.update()
      } catch (err) {
        console.error('[gamescroll]', err)
      }
      requestAnimationFrame(loop)
    }
    requestAnimationFrame(loop)
  </script>
</body>
</html>
