<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Chain Blast</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #160814; touch-action: none; }
    #stage { position: fixed; inset: 0; will-change: transform; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 2; }
    .hud {
      position: fixed; top: 1rem; left: 0; right: 0; text-align: center; z-index: 3;
      font: 800 2rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45); pointer-events: none;
      transform-origin: 50% 50%;
    }
    .float-score {
      position: fixed; z-index: 4; pointer-events: none;
      font: 800 1.15rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="hud" id="score">0</div>
  <script src="/lib/gsap.min.js"></script>
  <script src="/lib/proton.min.js"></script>
  <script src="/lib/juice.js"></script>
  <script src="/lib/playful.js"></script>
  <script>

    const GS = {
      paused: true,
      reported: false,
      onFail: 'replay',
      post(type, extra) {
        try { parent.postMessage(Object.assign({ type }, extra || {}), '*') } catch (e) {}
      },
      begin(msg) {
        const fail = msg && msg.onFail
        if (fail === 'gameover' || fail === 'replay') GS.onFail = fail
        if (!GS.reported) { GS.reported = true; GS.post('gamescroll:playing') }
        GS.paused = false
        if (typeof onHostStart === 'function') onHostStart()
      },
      halt() {
        GS.paused = true
        if (typeof onHostPause === 'function') onHostPause()
      }
    }
    addEventListener('message', (e) => {
      const t = e.data && e.data.type
      if (t === 'gamescroll:start') GS.begin(e.data)
      if (t === 'gamescroll:pause') GS.halt()
    })
    // Forward committed vertical flings to the host so swiping between games
    // works even though this iframe captures all pointer events. Thresholds are
    // high (long + fast + steep) so in-game taps, drags and short swipes never
    // trigger navigation.
    ;(function () {
      let sx = 0, sy = 0, st = 0, tracking = false
      addEventListener('pointerdown', (e) => {
        sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true
      }, true)
      addEventListener('pointerup', (e) => {
        if (!tracking) return
        tracking = false
        const dx = Math.abs(e.clientX - sx)
        const dy = e.clientY - sy
        const dt = performance.now() - st
        const minDist = Math.max(140, innerHeight * 0.22)
        if (dt > 350 || Math.abs(dy) < minDist || Math.abs(dy) < dx * 2.2) return
        GS.post(dy < 0 ? 'gamescroll:swipe-next' : 'gamescroll:swipe-prev')
      }, true)
      addEventListener('pointercancel', () => { tracking = false }, true)
    })()
    GS.post('gamescroll:ready')

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const scoreEl = document.getElementById('score')
    const dpr = Math.min(devicePixelRatio || 1, 2)
    let W = 0, H = 0, score = 0, last = performance.now()
    function setScore(n) { score = Math.max(0, n|0); scoreEl.textContent = String(score) }
    function reportScore() {
      if (score > 0) {
        try { parent.postMessage({ type: 'gamescroll:score', score }, '*') } catch (e) {}
      }
    }
    function bump(n) {
      const amount = n || 1
      setScore(score + amount)
      if (window.Juice) {
        const pos = typeof scorePos === 'function' ? scorePos() : null
        if (pos) Juice.onScore(amount, pos[0], pos[1])
        else Juice.onScore(amount)
      }
    }
    function resize() {
      W = innerWidth; H = innerHeight
      canvas.width = W * dpr; canvas.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      if (window.Juice) Juice.resize()
    }
    addEventListener('resize', () => { resize(); if (typeof onResize === 'function') onResize() })
    resize()
    if (window.Juice) Juice.init({ accent: "#ff6600" })

    const COLS = ['#ff6600', '#ff2d78', '#ffd166', '#66a3ff', '#22ffaa']
    let bubbles = [], chaining = false, queue = [], settle = 0, crowded = false
    function layout() {}
    function onResize() { layout() }
    function diePos() {
      const b = bubbles[0]
      return b ? [b.x, b.y] : [W * 0.5, H * 0.5]
    }
    function scorePos() { return diePos() }
    function fillField() {
      bubbles = []
      const n = 14 + ((Math.random() * 6) | 0)
      for (let i = 0; i < n; i++) {
        bubbles.push({
          x: 30 + Math.random() * (W - 60),
          y: 80 + Math.random() * (H * 0.7),
          r: 18 + Math.random() * 10,
          c: (Math.random() * COLS.length) | 0,
          vx: (Math.random() - 0.5) * 28,
          vy: (Math.random() - 0.5) * 28,
          pop: 0,
        })
      }
      crowded = bubbles.length >= 16
    }
    function reset() {
      layout()
      chaining = false
      queue = []
      settle = 0
      fillField()
      setScore(0)
    }
    function onHostStart() { reset() }
    function die() { reset() }
    function startChain(i) {
      if (chaining || GS.paused) return
      chaining = true
      queue = [i]
      bubbles[i].pop = 0.01
      settle = 0
    }
    function tick(dt) {
      for (const b of bubbles) {
        if (b.pop > 0) continue
        b.x += b.vx * dt
        b.y += b.vy * dt
        if (b.x < b.r || b.x > W - b.r) b.vx *= -1
        if (b.y < 50 + b.r || b.y > H - 40 - b.r) b.vy *= -1
        b.x = Math.max(b.r, Math.min(W - b.r, b.x))
        b.y = Math.max(50 + b.r, Math.min(H - 40 - b.r, b.y))
      }
      if (!chaining) return
      if (queue.length) {
        const i = queue.shift()
        const src = bubbles[i]
        if (!src || src.gone) return
        const chainR = src.r * 2.4
        src.gone = true
        bump()
        if (window.Juice) Juice.burst(src.x, src.y)
        for (let j = 0; j < bubbles.length; j++) {
          const o = bubbles[j]
          if (o.gone || o.pop > 0) continue
          if (o.c !== src.c) continue
          if (Math.hypot(o.x - src.x, o.y - src.y) <= chainR) {
            o.pop = 0.01
            queue.push(j)
          }
        }
      } else {
        settle += dt
        if (settle > 0.25) {
          const cleared = bubbles.filter(b => b.gone).length
          bubbles = bubbles.filter(b => !b.gone)
          chaining = false
          if (crowded && cleared < 3) {
            die()
            return
          }
          if (bubbles.length < 5) fillField()
          crowded = bubbles.length >= 16
        }
      }
    }
    function draw() {
      PF.sky(ctx, W, H, '#0a0408', '#160814', '#3a1028')
      PF.blobs(ctx, W, H, '#2a0a20', 4)
      PF.dots(ctx, W, H, '#ff6600', 10, 0.4)
      for (const b of bubbles) {
        if (b.gone) continue
        const a = b.pop > 0 ? 0.45 : 1
        ctx.globalAlpha = a
        ctx.fillStyle = COLS[b.c]
        ctx.beginPath()
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2)
        ctx.fill()
        ctx.fillStyle = 'rgba(255,255,255,0.35)'
        ctx.beginPath()
        ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.28, 0, Math.PI * 2)
        ctx.fill()
      }
      ctx.globalAlpha = 1
    }
    addEventListener('pointerdown', e => {
      if (GS.paused || chaining) return
      const r = canvas.getBoundingClientRect()
      const x = e.clientX - r.left
      const y = e.clientY - r.top
      let best = -1, bestD = 1e9
      for (let i = 0; i < bubbles.length; i++) {
        const b = bubbles[i]
        if (b.gone) continue
        const d = Math.hypot(b.x - x, b.y - y)
        if (d < b.r + 8 && d < bestD) { best = i; bestD = d }
      }
      if (best >= 0) startChain(best)
    })
    reset()

    if (typeof layout === 'function') {
      try { layout() } catch (e) { console.error('[gamescroll] layout()', e) }
    }
    ;(function () {
      const __halt = GS.halt
      GS.halt = function () {
        reportScore()
        __halt()
      }
    })()
    if (typeof die === 'function') {
      const __die = die
      die = function () {
        if (GS.paused) return
        reportScore()
        if (window.Juice) {
          const pos = typeof diePos === 'function' ? diePos() : null
          if (pos) Juice.onDie(pos[0], pos[1])
          else Juice.onDie()
        }
        if (GS.onFail === 'gameover') {
          GS.post('gamescroll:died', { score })
          GS.halt()
          return
        }
        __die()
      }
    }
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000)
      last = now
      try {
        if (window.PF) PF.t += dt
        if (!GS.paused && typeof tick === 'function') tick(dt)
        if (typeof draw === 'function') draw(now)
        if (window.Juice) Juice.update()
      } catch (err) {
        console.error('[gamescroll]', err)
      }
      requestAnimationFrame(loop)
    }
    requestAnimationFrame(loop)
  </script>
</body>
</html>
