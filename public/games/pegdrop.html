<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Peg Drop</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16082a; touch-action: none; }
    #stage { position: fixed; inset: 0; will-change: transform; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 2; }
    .hud {
      position: fixed; top: 1rem; left: 0; right: 0; text-align: center; z-index: 3;
      font: 800 2rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45); pointer-events: none;
      transform-origin: 50% 50%;
    }
    .float-score {
      position: fixed; z-index: 4; pointer-events: none;
      font: 800 1.15rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="hud" id="score">0</div>
  <script src="/lib/gsap.min.js"></script>
  <script src="/lib/proton.min.js"></script>
  <script src="/lib/juice.js"></script>
  <script src="/lib/playful.js"></script>
  <script>

    const GS = {
      paused: true,
      reported: false,
      onFail: 'replay',
      post(type, extra) {
        try { parent.postMessage(Object.assign({ type }, extra || {}), '*') } catch (e) {}
      },
      begin(msg) {
        const fail = msg && msg.onFail
        if (fail === 'gameover' || fail === 'replay') GS.onFail = fail
        if (!GS.reported) { GS.reported = true; GS.post('gamescroll:playing') }
        GS.paused = false
        if (typeof onHostStart === 'function') onHostStart()
      },
      halt() {
        GS.paused = true
        if (typeof onHostPause === 'function') onHostPause()
      }
    }
    addEventListener('message', (e) => {
      const t = e.data && e.data.type
      if (t === 'gamescroll:start') GS.begin(e.data)
      if (t === 'gamescroll:pause') GS.halt()
    })
    // Forward committed vertical flings to the host so swiping between games
    // works even though this iframe captures all pointer events. Thresholds are
    // high (long + fast + steep) so in-game taps, drags and short swipes never
    // trigger navigation.
    ;(function () {
      let sx = 0, sy = 0, st = 0, tracking = false
      addEventListener('pointerdown', (e) => {
        sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true
      }, true)
      addEventListener('pointerup', (e) => {
        if (!tracking) return
        tracking = false
        const dx = Math.abs(e.clientX - sx)
        const dy = e.clientY - sy
        const dt = performance.now() - st
        const minDist = Math.max(140, innerHeight * 0.22)
        if (dt > 350 || Math.abs(dy) < minDist || Math.abs(dy) < dx * 2.2) return
        GS.post(dy < 0 ? 'gamescroll:swipe-next' : 'gamescroll:swipe-prev')
      }, true)
      addEventListener('pointercancel', () => { tracking = false }, true)
    })()
    GS.post('gamescroll:ready')

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const scoreEl = document.getElementById('score')
    const dpr = Math.min(devicePixelRatio || 1, 2)
    let W = 0, H = 0, score = 0, last = performance.now()
    function setScore(n) { score = Math.max(0, n|0); scoreEl.textContent = String(score) }
    function reportScore() {
      if (score > 0) {
        try { parent.postMessage({ type: 'gamescroll:score', score }, '*') } catch (e) {}
      }
    }
    function bump(n) {
      const amount = n || 1
      setScore(score + amount)
      if (window.Juice) {
        const pos = typeof scorePos === 'function' ? scorePos() : null
        if (pos) Juice.onScore(amount, pos[0], pos[1])
        else Juice.onScore(amount)
      }
    }
    function resize() {
      W = innerWidth; H = innerHeight
      canvas.width = W * dpr; canvas.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      if (window.Juice) Juice.resize()
    }
    addEventListener('resize', () => { resize(); if (typeof onResize === 'function') onResize() })
    resize()
    if (window.Juice) Juice.init({ accent: "#ff44ff" })

    let pegs = [], slots = [], ball = null, aimX = 0, ballsLeft = 10, dropping = false
    let dropY = 0, slotY = 0
    function layout() {
      dropY = H * 0.08
      slotY = H * 0.9
      aimX = W * 0.5
      pegs = []
      const rows = 9, cols = 7
      const gapX = W / (cols + 1)
      const gapY = (slotY - dropY - 40) / (rows + 1)
      for (let r = 0; r < rows; r++) {
        const n = cols - (r % 2)
        const off = r % 2 ? gapX * 0.5 : 0
        for (let c = 0; c < n; c++) {
          pegs.push({
            x: gapX + off + c * gapX,
            y: dropY + 36 + r * gapY,
            r: 5,
          })
        }
      }
      const counts = slots.map(s => s.count || 0)
      slots = []
      const mults = [0.5, 1, 2, 5, 2, 1, 0.5]
      const sw = W / mults.length
      for (let i = 0; i < mults.length; i++) {
        slots.push({ x: i * sw, w: sw, mult: mults[i], count: counts[i] || 0 })
      }
    }
    function onResize() { layout() }
    function diePos() { return ball ? [ball.x, ball.y] : [aimX, dropY] }
    function scorePos() { return diePos() }
    function reset() {
      slots = []
      layout()
      for (const sl of slots) sl.count = 0
      ball = null
      dropping = false
      ballsLeft = 10
      setScore(0)
    }
    function onHostStart() { reset() }
    function die() { reset() }
    function drop() {
      if (GS.paused || dropping || ballsLeft <= 0) return
      dropping = true
      ballsLeft--
      ball = {
        x: aimX, y: dropY + 10,
        vx: (Math.random() - 0.5) * 40,
        vy: 40,
        r: 8,
      }
    }
    function tick(dt) {
      if (!ball) return
      const g = 900
      const sub = Math.max(1, Math.min(4, Math.ceil(dt / 0.012)))
      const h = dt / sub
      for (let s = 0; s < sub; s++) {
        ball.vy += g * h
        ball.x += ball.vx * h
        ball.y += ball.vy * h
        if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * 0.7 }
        if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.7 }
        for (const p of pegs) {
          const dx = ball.x - p.x
          const dy = ball.y - p.y
          const dist = Math.hypot(dx, dy) || 0.001
          const min = ball.r + p.r
          if (dist < min) {
            const nx = dx / dist, ny = dy / dist
            ball.x = p.x + nx * min
            ball.y = p.y + ny * min
            const vn = ball.vx * nx + ball.vy * ny
            if (vn < 0) {
              ball.vx -= 1.55 * vn * nx
              ball.vy -= 1.55 * vn * ny
            }
            ball.vx += (Math.random() - 0.5) * 30
          }
        }
      }
      if (ball.y >= slotY - ball.r) {
        let hit = slots[0]
        for (const sl of slots) {
          if (ball.x >= sl.x && ball.x < sl.x + sl.w) hit = sl
        }
        hit.count = (hit.count || 0) + 1
        const pts = Math.floor(10 * hit.mult)
        if (pts > 0) bump(pts)
        if (window.Juice) Juice.burst(ball.x, ball.y)
        ball = null
        dropping = false
        if (ballsLeft <= 0) die()
      }
    }
    function draw() {
      PF.sky(ctx, W, H, '#0a0418', '#16082a', '#3a1060')
      PF.dots(ctx, W, H, '#ff44ff', 14, 0.5)
      for (const p of pegs) {
        ctx.fillStyle = '#e0b0ff'
        ctx.beginPath()
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2)
        ctx.fill()
      }
      for (const sl of slots) {
        const hot = sl.mult >= 5
        PF.block(ctx, sl.x + 2, slotY, sl.w - 4, H - slotY, hot ? '#ff44ff' : '#4a2080', '#2a1040', 4)
        ctx.fillStyle = '#fff'
        ctx.font = '700 11px "Segoe UI", sans-serif'
        ctx.textAlign = 'center'
        ctx.fillText('x' + sl.mult, sl.x + sl.w * 0.5, slotY + 16)
        if (sl.count > 0) {
          ctx.fillStyle = '#ffe066'
          ctx.font = '800 14px "Segoe UI", sans-serif'
          ctx.fillText(String(sl.count), sl.x + sl.w * 0.5, slotY + 34)
        }
      }
      ctx.textAlign = 'left'
      if (!dropping) {
        ctx.strokeStyle = 'rgba(255,68,255,0.5)'
        ctx.beginPath()
        ctx.moveTo(aimX, dropY)
        ctx.lineTo(aimX, dropY + 28)
        ctx.stroke()
      }
      if (ball) {
        ctx.fillStyle = '#ffe066'
        ctx.beginPath()
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2)
        ctx.fill()
      }
      ctx.fillStyle = 'rgba(255,255,255,0.7)'
      ctx.font = '700 13px "Segoe UI", sans-serif'
      ctx.fillText('Balls ' + ballsLeft, 12, 28)
    }
    addEventListener('pointermove', e => {
      if (GS.paused || dropping) return
      const r = canvas.getBoundingClientRect()
      aimX = Math.max(16, Math.min(W - 16, e.clientX - r.left))
    })
    addEventListener('pointerdown', e => {
      if (GS.paused) return
      const r = canvas.getBoundingClientRect()
      aimX = Math.max(16, Math.min(W - 16, e.clientX - r.left))
      drop()
    })
    reset()

    if (typeof layout === 'function') {
      try { layout() } catch (e) { console.error('[gamescroll] layout()', e) }
    }
    ;(function () {
      const __halt = GS.halt
      GS.halt = function () {
        reportScore()
        __halt()
      }
    })()
    if (typeof die === 'function') {
      const __die = die
      die = function () {
        if (GS.paused) return
        reportScore()
        if (window.Juice) {
          const pos = typeof diePos === 'function' ? diePos() : null
          if (pos) Juice.onDie(pos[0], pos[1])
          else Juice.onDie()
        }
        if (GS.onFail === 'gameover') {
          GS.post('gamescroll:died', { score })
          GS.halt()
          return
        }
        __die()
      }
    }
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000)
      last = now
      try {
        if (window.PF) PF.t += dt
        if (!GS.paused && typeof tick === 'function') tick(dt)
        if (typeof draw === 'function') draw(now)
        if (window.Juice) Juice.update()
      } catch (err) {
        console.error('[gamescroll]', err)
      }
      requestAnimationFrame(loop)
    }
    requestAnimationFrame(loop)
  </script>
</body>
</html>
