<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>One Shot</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1210; touch-action: none; }
    #stage { position: fixed; inset: 0; will-change: transform; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 2; }
    .hud {
      position: fixed; top: 1rem; left: 0; right: 0; text-align: center; z-index: 3;
      font: 800 2rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45); pointer-events: none;
      transform-origin: 50% 50%;
    }
    .float-score {
      position: fixed; z-index: 4; pointer-events: none;
      font: 800 1.15rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="hud" id="score">0</div>
  <script src="/lib/gsap.min.js"></script>
  <script src="/lib/proton.min.js"></script>
  <script src="/lib/juice.js"></script>
  <script src="/lib/playful.js"></script>
  <script>

    const GS = {
      paused: true,
      started: false,
      reported: false,
      onFail: 'replay',
      post(type, extra) {
        try { parent.postMessage(Object.assign({ type }, extra || {}), '*') } catch (e) {}
      },
      begin(msg) {
        const fail = msg && msg.onFail
        if (fail === 'gameover' || fail === 'replay') GS.onFail = fail
        if (!GS.reported) { GS.reported = true; GS.post('gamescroll:playing') }
        const forceReset = !!(msg && msg.forceReset)
        const resuming = GS.started && GS.paused && !forceReset
        GS.paused = false
        GS.started = true
        if (!resuming && typeof onHostStart === 'function') onHostStart()
      },
      halt() {
        GS.paused = true
        if (typeof onHostPause === 'function') onHostPause()
      }
    }
    addEventListener('message', (e) => {
      const t = e.data && e.data.type
      if (t === 'gamescroll:start') GS.begin(e.data)
      if (t === 'gamescroll:pause') GS.halt()
    })
    // Forward committed vertical flings to the host so swiping between games
    // works even though this iframe captures all pointer events. Thresholds are
    // high (long + fast + steep) so in-game taps, drags and short swipes never
    // trigger navigation.
    ;(function () {
      let sx = 0, sy = 0, st = 0, tracking = false
      addEventListener('pointerdown', (e) => {
        sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true
      }, true)
      addEventListener('pointerup', (e) => {
        if (!tracking) return
        tracking = false
        const dx = Math.abs(e.clientX - sx)
        const dy = e.clientY - sy
        const dt = performance.now() - st
        const minDist = Math.max(140, innerHeight * 0.22)
        if (dt > 350 || Math.abs(dy) < minDist || Math.abs(dy) < dx * 2.2) return
        GS.post(dy < 0 ? 'gamescroll:swipe-next' : 'gamescroll:swipe-prev')
      }, true)
      addEventListener('pointercancel', () => { tracking = false }, true)
    })()
    GS.post('gamescroll:ready')

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const scoreEl = document.getElementById('score')
    const dpr = Math.min(devicePixelRatio || 1, 2)
    let W = 0, H = 0, score = 0, last = performance.now()
    function setScore(n) { score = Math.max(0, n|0); scoreEl.textContent = String(score) }
    function reportScore() {
      if (score > 0) {
        try { parent.postMessage({ type: 'gamescroll:score', score }, '*') } catch (e) {}
      }
    }
    function bump(n) {
      const amount = n || 1
      setScore(score + amount)
      if (window.Juice) {
        const pos = typeof scorePos === 'function' ? scorePos() : null
        if (pos) Juice.onScore(amount, pos[0], pos[1])
        else Juice.onScore(amount)
      }
    }
    function resize() {
      W = innerWidth; H = innerHeight
      canvas.width = W * dpr; canvas.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      if (window.Juice) Juice.resize()
    }
    addEventListener('resize', () => { resize(); if (typeof onResize === 'function') onResize() })
    resize()
    if (window.Juice) Juice.init({ accent: "#ffd166" })

    let cannonX = 0, cannonY = 0, aimX = 0, aimY = 0, dragging = false
    let bullet = null, targets = [], wave = 1, bouncing = false
    function layout() {
      cannonX = W * 0.5
      cannonY = H * 0.9
    }
    function onResize() { layout() }
    function diePos() { return bullet ? [bullet.x, bullet.y] : [cannonX, cannonY] }
    function scorePos() { return diePos() }
    function spawnTargets() {
      targets = []
      const n = 3 + Math.min(6, wave)
      for (let i = 0; i < n; i++) {
        targets.push({
          x: 40 + Math.random() * (W - 80),
          y: 60 + Math.random() * (H * 0.45),
          r: 14 + Math.random() * 6,
          alive: true,
        })
      }
    }
    function reset() {
      layout()
      aimX = cannonX
      aimY = cannonY - 80
      dragging = false
      bullet = null
      bouncing = false
      wave = 1
      spawnTargets()
      setScore(0)
    }
    function onHostStart() { reset() }
    function die() { reset() }
    function fire() {
      if (bullet || bouncing) return
      const dx = aimX - cannonX
      const dy = aimY - cannonY
      const len = Math.hypot(dx, dy) || 1
      const sp = Math.min(W, H) * 1.05
      bullet = {
        x: cannonX, y: cannonY - 10,
        vx: (dx / len) * sp,
        vy: (dy / len) * sp,
        r: 7,
        life: 4.5,
      }
      bouncing = true
    }
    function nextWave() {
      bump(5)
      wave++
      bullet = null
      bouncing = false
      spawnTargets()
      if (window.Juice) Juice.shake(0.6)
    }
    function tick(dt) {
      if (!bullet) return
      bullet.life -= dt
      bullet.x += bullet.vx * dt
      bullet.y += bullet.vy * dt
      if (bullet.x < bullet.r) { bullet.x = bullet.r; bullet.vx = Math.abs(bullet.vx) }
      if (bullet.x > W - bullet.r) { bullet.x = W - bullet.r; bullet.vx = -Math.abs(bullet.vx) }
      if (bullet.y < bullet.r) { bullet.y = bullet.r; bullet.vy = Math.abs(bullet.vy) }
      if (bullet.y > H - bullet.r) { bullet.y = H - bullet.r; bullet.vy = -Math.abs(bullet.vy) * 0.92 }
      for (const t of targets) {
        if (!t.alive) continue
        if (Math.hypot(t.x - bullet.x, t.y - bullet.y) < t.r + bullet.r) {
          t.alive = false
          bump()
          if (window.Juice) Juice.burst(t.x, t.y)
        }
      }
      const left = targets.filter(t => t.alive).length
      if (left === 0) {
        nextWave()
        return
      }
      if (bullet.life <= 0) die()
    }
    function draw() {
      PF.sky(ctx, W, H, '#04120e', '#0a1210', '#163828')
      PF.dots(ctx, W, H, '#ffd166', 12, 0.5)
      PF.blobs(ctx, W, H, '#1a4030', 3)
      for (const t of targets) {
        if (!t.alive) continue
        PF.buddy(ctx, t.x, t.y, t.r, '#ffd166', '#c9a227', { blush: true })
      }
      if (bullet) {
        ctx.fillStyle = '#fff6c2'
        ctx.shadowColor = '#ffd166'
        ctx.shadowBlur = 14
        ctx.beginPath()
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2)
        ctx.fill()
        ctx.shadowBlur = 0
      } else {
        ctx.strokeStyle = 'rgba(255,209,102,0.45)'
        ctx.setLineDash([6, 6])
        ctx.beginPath()
        ctx.moveTo(cannonX, cannonY)
        ctx.lineTo(aimX, aimY)
        ctx.stroke()
        ctx.setLineDash([])
      }
      PF.block(ctx, cannonX - 20, cannonY - 12, 40, 24, '#ffe8a0', '#9a7a20', 8)
    }
    function ptr(e) {
      const r = canvas.getBoundingClientRect()
      return { x: e.clientX - r.left, y: e.clientY - r.top }
    }
    addEventListener('pointerdown', e => {
      if (GS.paused || bullet) return
      dragging = true
      const p = ptr(e)
      aimX = p.x
      aimY = Math.min(cannonY - 20, p.y)
    })
    addEventListener('pointermove', e => {
      if (GS.paused || !dragging || bullet) return
      const p = ptr(e)
      aimX = p.x
      aimY = Math.min(cannonY - 20, p.y)
    })
    addEventListener('pointerup', () => {
      if (GS.paused) return
      if (dragging && !bullet) fire()
      dragging = false
    })
    reset()

    if (typeof layout === 'function') {
      try { layout() } catch (e) { console.error('[gamescroll] layout()', e) }
    }
    ;(function () {
      const __halt = GS.halt
      GS.halt = function () {
        reportScore()
        __halt()
      }
    })()
    if (typeof die === 'function') {
      const __die = die
      die = function () {
        if (GS.paused) return
        reportScore()
        if (window.Juice) {
          const pos = typeof diePos === 'function' ? diePos() : null
          if (pos) Juice.onDie(pos[0], pos[1])
          else Juice.onDie()
        }
        if (GS.onFail === 'gameover') {
          GS.post('gamescroll:died', { score })
          GS.halt()
          return
        }
        __die()
      }
    }
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000)
      last = now
      try {
        if (window.PF) PF.t += dt
        if (!GS.paused && typeof tick === 'function') tick(dt)
        if (typeof draw === 'function') draw(now)
        if (window.Juice) Juice.update()
      } catch (err) {
        console.error('[gamescroll]', err)
      }
      requestAnimationFrame(loop)
    }
    requestAnimationFrame(loop)
  </script>
</body>
</html>
