<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Color Pour</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f2e; touch-action: none; }
    #stage { position: fixed; inset: 0; will-change: transform; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 2; }
    .hud {
      position: fixed; top: 1rem; left: 0; right: 0; text-align: center; z-index: 3;
      font: 800 2rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45); pointer-events: none;
      transform-origin: 50% 50%;
    }
    .float-score {
      position: fixed; z-index: 4; pointer-events: none;
      font: 800 1.15rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="hud" id="score">0</div>
  <script src="/lib/gsap.min.js"></script>
  <script src="/lib/proton.min.js"></script>
  <script src="/lib/juice.js"></script>
  <script src="/lib/playful.js"></script>
  <script>

    const GS = {
      paused: true,
      started: false,
      reported: false,
      onFail: 'replay',
      post(type, extra) {
        try { parent.postMessage(Object.assign({ type }, extra || {}), '*') } catch (e) {}
      },
      begin(msg) {
        const fail = msg && msg.onFail
        if (fail === 'gameover' || fail === 'replay') GS.onFail = fail
        if (!GS.reported) { GS.reported = true; GS.post('gamescroll:playing') }
        const forceReset = !!(msg && msg.forceReset)
        const resuming = GS.started && GS.paused && !forceReset
        GS.paused = false
        GS.started = true
        if (!resuming && typeof onHostStart === 'function') onHostStart()
      },
      halt() {
        GS.paused = true
        if (typeof onHostPause === 'function') onHostPause()
      }
    }
    addEventListener('message', (e) => {
      const t = e.data && e.data.type
      if (t === 'gamescroll:start') GS.begin(e.data)
      if (t === 'gamescroll:pause') GS.halt()
    })
    // Forward committed vertical flings to the host so swiping between games
    // works even though this iframe captures all pointer events. Thresholds are
    // high (long + fast + steep) so in-game taps, drags and short swipes never
    // trigger navigation.
    ;(function () {
      let sx = 0, sy = 0, st = 0, tracking = false
      addEventListener('pointerdown', (e) => {
        sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true
      }, true)
      addEventListener('pointerup', (e) => {
        if (!tracking) return
        tracking = false
        const dx = Math.abs(e.clientX - sx)
        const dy = e.clientY - sy
        const dt = performance.now() - st
        const minDist = Math.max(140, innerHeight * 0.22)
        if (dt > 350 || Math.abs(dy) < minDist || Math.abs(dy) < dx * 2.2) return
        GS.post(dy < 0 ? 'gamescroll:swipe-next' : 'gamescroll:swipe-prev')
      }, true)
      addEventListener('pointercancel', () => { tracking = false }, true)
    })()
    GS.post('gamescroll:ready')

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const scoreEl = document.getElementById('score')
    const dpr = Math.min(devicePixelRatio || 1, 2)
    let W = 0, H = 0, score = 0, last = performance.now()
    function setScore(n) { score = Math.max(0, n|0); scoreEl.textContent = String(score) }
    function reportScore() {
      if (score > 0) {
        try { parent.postMessage({ type: 'gamescroll:score', score }, '*') } catch (e) {}
      }
    }
    function bump(n) {
      const amount = n || 1
      setScore(score + amount)
      if (window.Juice) {
        const pos = typeof scorePos === 'function' ? scorePos() : null
        if (pos) Juice.onScore(amount, pos[0], pos[1])
        else Juice.onScore(amount)
      }
    }
    function resize() {
      W = innerWidth; H = innerHeight
      canvas.width = W * dpr; canvas.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      if (window.Juice) Juice.resize()
    }
    addEventListener('resize', () => { resize(); if (typeof onResize === 'function') onResize() })
    resize()
    if (window.Juice) Juice.init({ accent: "#ffd23f" })

    let tubes = [], ox = 0, oy = 0, tw = 0, th = 0, gap = 12, rowGap = 24, cap = 4
    let sel = -1, level = 1, moves = 0, bounce = 0, pourFlash = 0
    const COLORS = ['#ff4d6d', '#3a86ff', '#06d6a0', '#ffd23f', '#c77dff', '#ff9f1c']
    const INK = '#1a1025'
    function layout() {
      const n = tubes.length || 6
      const cols = Math.min(5, n)
      const rows = Math.ceil(n / cols)
      const topSafe = Math.max(72, H * 0.13)
      const bottomSafe = Math.max(28, H * 0.06)
      const availH = Math.max(120, H - topSafe - bottomSafe)
      gap = Math.max(12, Math.min(20, W * 0.04))
      rowGap = Math.max(22, Math.min(34, availH * 0.05))
      const rowBudget = (availH - (rows - 1) * rowGap) / rows
      tw = Math.min(82, (W - 36 - gap * (cols - 1)) / cols)
      th = Math.min(rowBudget - 8, tw * (3.2 + cap * 0.35))
      const totalW = cols * tw + (cols - 1) * gap
      const totalH = rows * th + (rows - 1) * rowGap
      ox = (W - totalW) * 0.5
      oy = topSafe + Math.max(0, (availH - totalH) * 0.45)
    }
    function onResize() { layout() }
    function diePos() { return [W * 0.5, oy + th * 0.5] }
    function scorePos() { return diePos() }
    function isMixed(t) {
      if (t.length < 2) return false
      for (let i = 1; i < t.length; i++) if (t[i] !== t[0]) return true
      return false
    }
    function mixedCount() {
      let n = 0
      for (let i = 0; i < tubes.length; i++) if (isMixed(tubes[i])) n++
      return n
    }
    function moveUnit(from, to) {
      if (from === to || !tubes[from].length || tubes[to].length >= cap) return false
      // Prefer breaking mono tubes into occupied tubes so layers sandwich.
      tubes[to].push(tubes[from].pop())
      return true
    }
    function forceSandwiches(n, need) {
      let guard = 80
      while (mixedCount() < need && guard-- > 0) {
        // Pull a unit from a mono stack onto a different-color top.
        let moved = false
        for (let a = 0; a < n && !moved; a++) {
          if (tubes[a].length < 2) continue
          if (!tubes[a].every(c => c === tubes[a][0])) continue
          for (let b = 0; b < n; b++) {
            if (a === b || tubes[b].length >= cap || !tubes[b].length) continue
            if (tubes[b][tubes[b].length - 1] === tubes[a][tubes[a].length - 1]) continue
            moveUnit(a, b)
            moved = true
            break
          }
        }
        if (!moved) {
          const from = (Math.random() * n) | 0
          const to = (Math.random() * n) | 0
          moveUnit(from, to)
        }
      }
    }
    function makeLevel(lv) {
      cap = lv <= 2 ? 4 : lv <= 5 ? 5 : 6
      const colors = Math.min(6, lv <= 1 ? 4 : lv <= 3 ? 5 : 6)
      const empties = lv <= 2 ? 2 : lv <= 6 ? 2 : 1
      const n = colors + empties
      const solved = []
      for (let i = 0; i < colors; i++) solved.push(Array(cap).fill(i))
      for (let i = 0; i < empties; i++) solved.push([])
      tubes = solved.map(t => t.slice())
      const scramble = 90 + lv * 22
      for (let s = 0; s < scramble; s++) {
        const from = (Math.random() * n) | 0
        const to = (Math.random() * n) | 0
        if (from === to || !tubes[from].length || tubes[to].length >= cap) continue
        if (
          tubes[to].length === 0 &&
          tubes[from].length === cap &&
          tubes[from].every(c => c === tubes[from][0])
        ) continue
        tubes[to].push(tubes[from].pop())
      }
      const needMixed = Math.min(colors, 2 + ((lv + 1) / 2 | 0))
      forceSandwiches(n, needMixed)
      if (tubes.every(t => !t.length || (t.length === cap && t.every(c => c === t[0])))) {
        forceSandwiches(n, Math.max(2, needMixed))
      }
    }
    function canPour(a, b) {
      if (a < 0 || b < 0 || a === b) return false
      const A = tubes[a], B = tubes[b]
      if (!A.length || B.length >= cap) return false
      const color = A[A.length - 1]
      if (B.length && B[B.length - 1] !== color) return false
      return true
    }
    function pour(a, b) {
      const color = tubes[a][tubes[a].length - 1]
      let n = 0
      while (
        tubes[a].length &&
        tubes[a][tubes[a].length - 1] === color &&
        tubes[b].length < cap
      ) {
        tubes[b].push(tubes[a].pop())
        n++
      }
      return n
    }
    function isWon() {
      return tubes.every(t => !t.length || (t.length === cap && t.every(c => c === t[0])))
    }
    function reset() {
      makeLevel(level)
      layout()
      sel = -1
      moves = 0
      bounce = 0
      pourFlash = 0
      setScore(Math.max(0, (level - 1) * 100))
    }
    function onHostStart() { level = 1; reset() }
    function die() { level = 1; reset() }
    function tick(dt) {
      if (bounce > 0) bounce = Math.max(0, bounce - dt * 4)
      if (pourFlash > 0) pourFlash = Math.max(0, pourFlash - dt * 3)
    }
    function tubeAt(e) {
      const rect = canvas.getBoundingClientRect()
      const x = e.clientX - rect.left
      const y = e.clientY - rect.top
      const cols = Math.min(5, tubes.length)
      for (let i = 0; i < tubes.length; i++) {
        const r = (i / cols) | 0, c = i % cols
        const tx = ox + c * (tw + gap)
        const ty = oy + r * (th + rowGap) - (sel === i ? 10 : 0)
        if (x >= tx - 4 && x <= tx + tw + 4 && y >= ty - 8 && y <= ty + th + 12) return i
      }
      return -1
    }
    function tubePath(x, y, w, h) {
      const r = Math.min(18, w * 0.42)
      ctx.beginPath()
      ctx.moveTo(x, y)
      ctx.lineTo(x, y + h - r)
      ctx.quadraticCurveTo(x, y + h + 4, x + w * 0.5, y + h + 6)
      ctx.quadraticCurveTo(x + w, y + h + 4, x + w, y + h - r)
      ctx.lineTo(x + w, y)
    }
    function drawLiquid(x, y, w, h, colorIdx, top) {
      const c0 = COLORS[colorIdx]
      const g = ctx.createLinearGradient(x, y, x + w, y)
      g.addColorStop(0, c0)
      g.addColorStop(0.45, 'rgba(255,255,255,0.4)')
      g.addColorStop(0.55, c0)
      g.addColorStop(1, c0)
      ctx.fillStyle = g
      ctx.beginPath()
      if (top) {
        ctx.moveTo(x, y + 4)
        ctx.quadraticCurveTo(x + w * 0.25, y - 3, x + w * 0.5, y + 2)
        ctx.quadraticCurveTo(x + w * 0.75, y + 7, x + w, y + 2)
        ctx.lineTo(x + w, y + h)
        ctx.lineTo(x, y + h)
      } else {
        ctx.rect(x, y, w, h)
      }
      ctx.closePath()
      ctx.fill()
      ctx.strokeStyle = INK
      ctx.lineWidth = 2.5
      ctx.stroke()
      ctx.fillStyle = 'rgba(255,255,255,0.55)'
      ctx.beginPath()
      ctx.ellipse(x + w * 0.28, y + h * 0.35, w * 0.1, h * 0.12, -0.4, 0, Math.PI * 2)
      ctx.fill()
      if (top) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)'
        ctx.beginPath()
        ctx.arc(x + w * 0.65, y + h * 0.4, Math.max(2, w * 0.07), 0, Math.PI * 2)
        ctx.fill()
        ctx.beginPath()
        ctx.arc(x + w * 0.78, y + h * 0.55, Math.max(1.5, w * 0.045), 0, Math.PI * 2)
        ctx.fill()
      }
    }
    function drawTube(i, x, y) {
      const lift = sel === i ? 12 + Math.sin(bounce * Math.PI) * 4 : 0
      const yy = y - lift
      // Drop shadow
      ctx.fillStyle = 'rgba(0,0,0,0.22)'
      ctx.beginPath()
      ctx.ellipse(x + tw * 0.5, y + th + 10, tw * 0.42, 7, 0, 0, Math.PI * 2)
      ctx.fill()
      // Glass fill
      tubePath(x, yy, tw, th)
      ctx.fillStyle = sel === i ? 'rgba(255,210,63,0.18)' : 'rgba(255,255,255,0.14)'
      ctx.fill()
      const pad = 5
      const unit = (th - 14) / cap
      const topK = tubes[i].length - 1
      for (let k = 0; k < tubes[i].length; k++) {
        const by = yy + th - 8 - (k + 1) * unit
        drawLiquid(x + pad, by, tw - pad * 2, unit + 1, tubes[i][k], k === topK)
      }
      // Thick comic outline
      tubePath(x, yy, tw, th)
      ctx.strokeStyle = INK
      ctx.lineWidth = sel === i ? 5 : 4
      ctx.lineJoin = 'round'
      ctx.stroke()
      if (sel === i) {
        tubePath(x - 1, yy - 1, tw + 2, th + 2)
        ctx.strokeStyle = '#ffd23f'
        ctx.lineWidth = 3
        ctx.stroke()
      }
      // Comic rim / lip
      ctx.fillStyle = INK
      PF.rr(ctx, x - 4, yy - 6, tw + 8, 10, 4)
      ctx.fill()
      ctx.fillStyle = sel === i ? '#ffd23f' : '#ffe8a3'
      PF.rr(ctx, x - 2, yy - 4, tw + 4, 6, 3)
      ctx.fill()
      // Shine streak on glass
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'
      ctx.lineWidth = 3
      ctx.lineCap = 'round'
      ctx.beginPath()
      ctx.moveTo(x + tw * 0.18, yy + 16)
      ctx.lineTo(x + tw * 0.18, yy + th * 0.55)
      ctx.stroke()
    }
    function drawBadge() {
      const label = 'LV ' + level
      ctx.font = '800 16px "Segoe UI", sans-serif'
      const w = ctx.measureText(label).width + 28
      const x = 12, y = 12
      ctx.fillStyle = INK
      PF.rr(ctx, x + 3, y + 3, w, 32, 12)
      ctx.fill()
      ctx.fillStyle = '#ffd23f'
      PF.rr(ctx, x, y, w, 32, 12)
      ctx.fill()
      ctx.strokeStyle = INK
      ctx.lineWidth = 3
      PF.rr(ctx, x, y, w, 32, 12)
      ctx.stroke()
      ctx.fillStyle = INK
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      ctx.fillText(label, x + w * 0.5, y + 17)
      ctx.textAlign = 'left'
      ctx.textBaseline = 'alphabetic'
    }
    function draw() {
      PF.sky(ctx, W, H, '#2b1b4e', '#1a0f2e', '#3d1f5c')
      // Comic halftone
      ctx.fillStyle = '#ffd23f'
      for (let i = 0; i < 28; i++) {
        const px = ((i * 97 + PF.t * 12) % (W + 30)) - 15
        const py = ((i * 61) % H)
        ctx.globalAlpha = 0.08 + (i % 4) * 0.02
        ctx.beginPath()
        ctx.arc(px, py, 3 + (i % 3), 0, Math.PI * 2)
        ctx.fill()
      }
      ctx.globalAlpha = 1
      // Soft comic blobs
      PF.blobs(ctx, W, H, '#ff4d6d', 4)
      const cols = Math.min(5, tubes.length)
      for (let i = 0; i < tubes.length; i++) {
        const r = (i / cols) | 0, c = i % cols
        const x = ox + c * (tw + gap)
        const y = oy + r * (th + rowGap)
        drawTube(i, x, y)
      }
      if (pourFlash > 0) {
        ctx.fillStyle = 'rgba(255,210,63,' + (pourFlash * 0.25) + ')'
        ctx.fillRect(0, 0, W, H)
      }
      drawBadge()
    }
    addEventListener('pointerdown', e => {
      if (GS.paused) return
      const i = tubeAt(e)
      if (i < 0) { sel = -1; return }
      if (sel < 0) { sel = i; bounce = 1; return }
      if (sel === i) { sel = -1; return }
      if (!canPour(sel, i)) { sel = i; bounce = 1; return }
      pour(sel, i)
      moves++
      bump(1)
      pourFlash = 1
      if (window.Juice) {
        const cols = Math.min(5, tubes.length)
        const r = (i / cols) | 0, c = i % cols
        Juice.burst(ox + c * (tw + gap) + tw * 0.5, oy + r * (th + rowGap) + th * 0.3)
      }
      sel = -1
      if (isWon()) {
        bump(Math.max(20, 100 - moves * 2))
        if (window.Juice) Juice.burst(W * 0.5, oy + th * 0.5)
        level++
        reset()
      }
    })
    reset()

    if (typeof layout === 'function') {
      try { layout() } catch (e) { console.error('[gamescroll] layout()', e) }
    }
    ;(function () {
      const __halt = GS.halt
      GS.halt = function () {
        reportScore()
        __halt()
      }
    })()
    if (typeof die === 'function') {
      const __die = die
      die = function () {
        if (GS.paused) return
        reportScore()
        if (window.Juice) {
          const pos = typeof diePos === 'function' ? diePos() : null
          if (pos) Juice.onDie(pos[0], pos[1])
          else Juice.onDie()
        }
        if (GS.onFail === 'gameover') {
          GS.post('gamescroll:died', { score })
          GS.halt()
          return
        }
        __die()
      }
    }
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000)
      last = now
      try {
        if (window.PF) PF.t += dt
        if (!GS.paused && typeof tick === 'function') tick(dt)
        if (typeof draw === 'function') draw(now)
        if (window.Juice) Juice.update()
      } catch (err) {
        console.error('[gamescroll]', err)
      }
      requestAnimationFrame(loop)
    }
    requestAnimationFrame(loop)
  </script>
</body>
</html>
