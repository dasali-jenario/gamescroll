<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Neon Dash</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0a2e; touch-action: none; }
    #stage { position: fixed; inset: 0; will-change: transform; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 2; }
    .hud {
      position: fixed; top: 1rem; left: 0; right: 0; text-align: center; z-index: 3;
      font: 800 2rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45); pointer-events: none;
      transform-origin: 50% 50%;
    }
    .float-score {
      position: fixed; z-index: 4; pointer-events: none;
      font: 800 1.15rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="hud" id="score">0</div>
  <script src="/lib/gsap.min.js"></script>
  <script src="/lib/proton.min.js"></script>
  <script src="/lib/juice.js"></script>
  <script src="/lib/playful.js"></script>
  <script>

    const GS = {
      paused: true,
      reported: false,
      onFail: 'replay',
      post(type, extra) {
        try { parent.postMessage(Object.assign({ type }, extra || {}), '*') } catch (e) {}
      },
      begin(msg) {
        const fail = msg && msg.onFail
        if (fail === 'gameover' || fail === 'replay') GS.onFail = fail
        if (!GS.reported) { GS.reported = true; GS.post('gamescroll:playing') }
        GS.paused = false
        if (typeof onHostStart === 'function') onHostStart()
      },
      halt() {
        GS.paused = true
        if (typeof onHostPause === 'function') onHostPause()
      }
    }
    addEventListener('message', (e) => {
      const t = e.data && e.data.type
      if (t === 'gamescroll:start') GS.begin(e.data)
      if (t === 'gamescroll:pause') GS.halt()
    })
    // Forward committed vertical flings to the host so swiping between games
    // works even though this iframe captures all pointer events. Thresholds are
    // high (long + fast + steep) so in-game taps, drags and short swipes never
    // trigger navigation.
    ;(function () {
      let sx = 0, sy = 0, st = 0, tracking = false
      addEventListener('pointerdown', (e) => {
        sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true
      }, true)
      addEventListener('pointerup', (e) => {
        if (!tracking) return
        tracking = false
        const dx = Math.abs(e.clientX - sx)
        const dy = e.clientY - sy
        const dt = performance.now() - st
        const minDist = Math.max(140, innerHeight * 0.22)
        if (dt > 350 || Math.abs(dy) < minDist || Math.abs(dy) < dx * 2.2) return
        GS.post(dy < 0 ? 'gamescroll:swipe-next' : 'gamescroll:swipe-prev')
      }, true)
      addEventListener('pointercancel', () => { tracking = false }, true)
    })()
    GS.post('gamescroll:ready')

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const scoreEl = document.getElementById('score')
    const dpr = Math.min(devicePixelRatio || 1, 2)
    let W = 0, H = 0, score = 0, last = performance.now()
    function setScore(n) { score = Math.max(0, n|0); scoreEl.textContent = String(score) }
    function reportScore() {
      if (score > 0) {
        try { parent.postMessage({ type: 'gamescroll:score', score }, '*') } catch (e) {}
      }
    }
    function bump(n) {
      const amount = n || 1
      setScore(score + amount)
      if (window.Juice) {
        const pos = typeof scorePos === 'function' ? scorePos() : null
        if (pos) Juice.onScore(amount, pos[0], pos[1])
        else Juice.onScore(amount)
      }
    }
    function resize() {
      W = innerWidth; H = innerHeight
      canvas.width = W * dpr; canvas.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      if (window.Juice) Juice.resize()
    }
    addEventListener('resize', () => { resize(); if (typeof onResize === 'function') onResize() })
    resize()
    if (window.Juice) Juice.init({ accent: "#ff2d78" })

    let px = 0, py = 0, vy = 0, onGround = true, jumps = 0, sliding = 0
    let obstacles = [], spawn = 0.65, distAcc = 0, groundY = 0
    let sx0 = 0, sy0 = 0, tracking = false
    function layout() {
      px = W * 0.26
      groundY = H * 0.78
      py = groundY
    }
    function onResize() { layout() }
    function diePos() { return [px, py] }
    function scorePos() { return [px, py - 20] }
    function reset() {
      layout()
      vy = 0
      onGround = true
      jumps = 0
      sliding = 0
      obstacles = []
      spawn = 0.55
      distAcc = 0
      tracking = false
      setScore(0)
    }
    function onHostStart() { reset() }
    function die() { reset() }
    function jump() {
      if (sliding > 0) return
      if (onGround || jumps < 2) {
        vy = -Math.min(W, H) * 0.92
        onGround = false
        jumps++
      }
    }
    function slide() {
      if (!onGround) return
      sliding = 0.55
    }
    function tick(dt) {
      sliding = Math.max(0, sliding - dt)
      const g = Math.min(W, H) * 2.5
      if (sliding <= 0) {
        vy += g * dt
        py += vy * dt
      } else {
        py = groundY
        vy = 0
      }
      if (py >= groundY) {
        py = groundY
        vy = 0
        onGround = true
        jumps = 0
      }
      const speed = 200 + score * 3.5
      spawn -= dt
      if (spawn <= 0) {
        const kind = Math.random() < 0.45 ? 'bar' : 'block'
        if (kind === 'bar') {
          obstacles.push({
            kind: 'bar',
            x: W + 40,
            y: groundY - 52,
            w: 70 + Math.random() * 40,
            h: 14,
          })
        } else {
          const h = 30 + Math.random() * 34
          obstacles.push({
            kind: 'block',
            x: W + 30,
            y: groundY - h,
            w: 24 + Math.random() * 16,
            h: h,
          })
        }
        spawn = 0.7 + Math.random() * 0.5
      }
      for (const o of obstacles) o.x -= speed * dt
      const prx = 14
      const pry = sliding > 0 ? 8 : 14
      const pTop = py - (sliding > 0 ? 4 : 14)
      obstacles = obstacles.filter(o => {
        if (o.x + o.w < -20) return false
        if (px + prx > o.x && px - prx < o.x + o.w && pTop + pry * 2 > o.y && pTop < o.y + o.h) {
          if (o.kind === 'bar' && sliding > 0) return true
          die()
        }
        return true
      })
      distAcc += dt
      if (distAcc > 0.5) { distAcc = 0; bump() }
    }
    function draw() {
      PF.sky(ctx, W, H, '#0c0418', '#1a0a2e', '#3a1050')
      PF.dots(ctx, W, H, '#ff2d78', 16, 0.65)
      PF.block(ctx, 0, groundY + 12, W, H - groundY, '#12061e', '#080310', 0)
      ctx.strokeStyle = 'rgba(255,45,120,0.35)'
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.moveTo(0, groundY + 4)
      ctx.lineTo(W, groundY + 4)
      ctx.stroke()
      for (const o of obstacles) {
        if (o.kind === 'bar') {
          PF.block(ctx, o.x, o.y, o.w, o.h, '#66f0ff', '#00aacc', 6)
        } else {
          PF.block(ctx, o.x, o.y, o.w, o.h, '#ff6b9a', '#ff2d78', 6)
        }
      }
      const r = sliding > 0 ? 10 : 14
      PF.buddy(ctx, px, py - (sliding > 0 ? 2 : 4), r, '#ffd0e0', '#ff8fb0', {
        lookX: 0.7,
        lookY: sliding > 0 ? 0.5 : (onGround ? 0.1 : -0.4),
        squash: sliding > 0 ? 0.55 : 1,
        stretch: sliding > 0 ? 1.35 : 1,
        blush: true,
      })
    }
    addEventListener('pointerdown', e => {
      if (GS.paused) return
      tracking = true
      sx0 = e.clientX
      sy0 = e.clientY
    })
    addEventListener('pointerup', e => {
      if (GS.paused || !tracking) return
      tracking = false
      const dx = e.clientX - sx0
      const dy = e.clientY - sy0
      if (dy > 48 && Math.abs(dy) > Math.abs(dx) * 1.1) slide()
      else jump()
    })
    addEventListener('pointercancel', () => { tracking = false })
    reset()

    if (typeof layout === 'function') {
      try { layout() } catch (e) { console.error('[gamescroll] layout()', e) }
    }
    ;(function () {
      const __halt = GS.halt
      GS.halt = function () {
        reportScore()
        __halt()
      }
    })()
    if (typeof die === 'function') {
      const __die = die
      die = function () {
        if (GS.paused) return
        reportScore()
        if (window.Juice) {
          const pos = typeof diePos === 'function' ? diePos() : null
          if (pos) Juice.onDie(pos[0], pos[1])
          else Juice.onDie()
        }
        if (GS.onFail === 'gameover') {
          GS.post('gamescroll:died', { score })
          GS.halt()
          return
        }
        __die()
      }
    }
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000)
      last = now
      try {
        if (window.PF) PF.t += dt
        if (!GS.paused && typeof tick === 'function') tick(dt)
        if (typeof draw === 'function') draw(now)
        if (window.Juice) Juice.update()
      } catch (err) {
        console.error('[gamescroll]', err)
      }
      requestAnimationFrame(loop)
    }
    requestAnimationFrame(loop)
  </script>
</body>
</html>
