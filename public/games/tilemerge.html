<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Tile Merge</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a2e; touch-action: none; }
    #stage { position: fixed; inset: 0; will-change: transform; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 2; }
    .hud {
      position: fixed; top: 1rem; left: 0; right: 0; text-align: center; z-index: 3;
      font: 800 2rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45); pointer-events: none;
      transform-origin: 50% 50%;
    }
    .float-score {
      position: fixed; z-index: 4; pointer-events: none;
      font: 800 1.15rem "Segoe UI", sans-serif; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="hud" id="score">0</div>
  <script src="/lib/gsap.min.js"></script>
  <script src="/lib/proton.min.js"></script>
  <script src="/lib/juice.js"></script>
  <script src="/lib/playful.js"></script>
  <script>

    const GS = {
      paused: true,
      reported: false,
      onFail: 'replay',
      post(type, extra) {
        try { parent.postMessage(Object.assign({ type }, extra || {}), '*') } catch (e) {}
      },
      begin(msg) {
        const fail = msg && msg.onFail
        if (fail === 'gameover' || fail === 'replay') GS.onFail = fail
        if (!GS.reported) { GS.reported = true; GS.post('gamescroll:playing') }
        GS.paused = false
        if (typeof onHostStart === 'function') onHostStart()
      },
      halt() {
        GS.paused = true
        if (typeof onHostPause === 'function') onHostPause()
      }
    }
    addEventListener('message', (e) => {
      const t = e.data && e.data.type
      if (t === 'gamescroll:start') GS.begin(e.data)
      if (t === 'gamescroll:pause') GS.halt()
    })
    // Forward committed vertical flings to the host so swiping between games
    // works even though this iframe captures all pointer events. Thresholds are
    // high (long + fast + steep) so in-game taps, drags and short swipes never
    // trigger navigation.
    ;(function () {
      let sx = 0, sy = 0, st = 0, tracking = false
      addEventListener('pointerdown', (e) => {
        sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true
      }, true)
      addEventListener('pointerup', (e) => {
        if (!tracking) return
        tracking = false
        const dx = Math.abs(e.clientX - sx)
        const dy = e.clientY - sy
        const dt = performance.now() - st
        const minDist = Math.max(140, innerHeight * 0.22)
        if (dt > 350 || Math.abs(dy) < minDist || Math.abs(dy) < dx * 2.2) return
        GS.post(dy < 0 ? 'gamescroll:swipe-next' : 'gamescroll:swipe-prev')
      }, true)
      addEventListener('pointercancel', () => { tracking = false }, true)
    })()
    GS.post('gamescroll:ready')

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')
    const scoreEl = document.getElementById('score')
    const dpr = Math.min(devicePixelRatio || 1, 2)
    let W = 0, H = 0, score = 0, last = performance.now()
    function setScore(n) { score = Math.max(0, n|0); scoreEl.textContent = String(score) }
    function reportScore() {
      if (score > 0) {
        try { parent.postMessage({ type: 'gamescroll:score', score }, '*') } catch (e) {}
      }
    }
    function bump(n) {
      const amount = n || 1
      setScore(score + amount)
      if (window.Juice) {
        const pos = typeof scorePos === 'function' ? scorePos() : null
        if (pos) Juice.onScore(amount, pos[0], pos[1])
        else Juice.onScore(amount)
      }
    }
    function resize() {
      W = innerWidth; H = innerHeight
      canvas.width = W * dpr; canvas.height = H * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      if (window.Juice) Juice.resize()
    }
    addEventListener('resize', () => { resize(); if (typeof onResize === 'function') onResize() })
    resize()
    if (window.Juice) Juice.init({ accent: "#e94560" })

    let grid = [], ox = 0, oy = 0, cell = 0, gap = 8, lock = 0
    let sx = 0, sy = 0, dragging = false
    const N = 4
    const COLORS = {
      0: '#2a2a40', 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563',
      32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61',
      512: '#edc850', 1024: '#edc53f', 2048: '#edc22e',
    }
    function layout() {
      const pad = 18
      const side = Math.min(W - pad * 2, H * 0.62)
      cell = (side - gap * (N + 1)) / N
      ox = (W - side) * 0.5
      oy = H * 0.22
    }
    function onResize() { layout() }
    function diePos() { return [W * 0.5, oy + cell * 2] }
    function scorePos() { return diePos() }
    function emptyCells() {
      const out = []
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) out.push([r, c])
      return out
    }
    function spawn() {
      const e = emptyCells()
      if (!e.length) return
      const [r, c] = e[(Math.random() * e.length) | 0]
      grid[r][c] = Math.random() < 0.9 ? 2 : 4
    }
    function slideRow(row) {
      const vals = row.filter(v => v)
      let gained = 0
      const out = []
      for (let i = 0; i < vals.length; i++) {
        if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
          const m = vals[i] * 2
          out.push(m)
          gained += m
          i++
        } else out.push(vals[i])
      }
      while (out.length < N) out.push(0)
      return { row: out, gained }
    }
    function rotate(g) {
      const n = Array.from({ length: N }, () => Array(N).fill(0))
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) n[c][N - 1 - r] = g[r][c]
      return n
    }
    function move(dir) {
      // 0 L, 1 U, 2 R, 3 D — rotate so we always slide left
      let g = grid.map(r => r.slice())
      for (let i = 0; i < dir; i++) g = rotate(g)
      let gained = 0, changed = false
      for (let r = 0; r < N; r++) {
        const before = g[r].join(',')
        const res = slideRow(g[r])
        g[r] = res.row
        gained += res.gained
        if (g[r].join(',') !== before) changed = true
      }
      for (let i = 0; i < (4 - dir) % 4; i++) g = rotate(g)
      if (!changed) return false
      grid = g
      if (gained) bump(gained)
      spawn()
      if (!canMove()) die()
      return true
    }
    function canMove() {
      if (emptyCells().length) return true
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const v = grid[r][c]
        if (c + 1 < N && grid[r][c + 1] === v) return true
        if (r + 1 < N && grid[r + 1][c] === v) return true
      }
      return false
    }
    function reset() {
      layout()
      grid = Array.from({ length: N }, () => Array(N).fill(0))
      lock = 0
      setScore(0)
      spawn(); spawn()
    }
    function onHostStart() { reset() }
    function die() { reset() }
    function tick(dt) { lock = Math.max(0, lock - dt) }
    function draw() {
      PF.sky(ctx, W, H, '#0f0f1a', '#1a1a2e', '#2d2d44')
      PF.dots(ctx, W, H, '#e94560', 12, 0.4)
      const side = cell * N + gap * (N + 1)
      PF.block(ctx, ox, oy, side, side, '#16162a', '#0c0c18', 14)
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const v = grid[r][c]
        const x = ox + gap + c * (cell + gap)
        const y = oy + gap + r * (cell + gap)
        PF.block(ctx, x, y, cell, cell, COLORS[v] || '#3c3a32', '#222', 8)
        if (v) {
          ctx.fillStyle = v <= 4 ? '#776e65' : '#f9f6f2'
          ctx.font = '800 ' + Math.floor(cell * (v >= 1000 ? 0.32 : 0.4)) + 'px "Segoe UI", sans-serif'
          ctx.textAlign = 'center'
          ctx.textBaseline = 'middle'
          ctx.fillText(String(v), x + cell * 0.5, y + cell * 0.52)
        }
      }
      ctx.textAlign = 'left'
      ctx.textBaseline = 'alphabetic'
    }
    function trySwipe(dx, dy) {
      if (GS.paused || lock > 0) return
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return
      lock = 0.12
      if (Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 0 : 2)
      else move(dy < 0 ? 1 : 3)
    }
    addEventListener('pointerdown', e => {
      if (GS.paused) return
      dragging = true
      sx = e.clientX; sy = e.clientY
    })
    addEventListener('pointerup', e => {
      if (!dragging) return
      dragging = false
      trySwipe(e.clientX - sx, e.clientY - sy)
    })
    addEventListener('pointercancel', () => { dragging = false })
    addEventListener('keydown', e => {
      if (GS.paused || lock > 0) return
      const map = { ArrowLeft: 0, a: 0, ArrowUp: 1, w: 1, ArrowRight: 2, d: 2, ArrowDown: 3, s: 3 }
      if (map[e.key] == null) return
      lock = 0.12
      move(map[e.key])
    })
    reset()

    if (typeof layout === 'function') {
      try { layout() } catch (e) { console.error('[gamescroll] layout()', e) }
    }
    ;(function () {
      const __halt = GS.halt
      GS.halt = function () {
        reportScore()
        __halt()
      }
    })()
    if (typeof die === 'function') {
      const __die = die
      die = function () {
        if (GS.paused) return
        reportScore()
        if (window.Juice) {
          const pos = typeof diePos === 'function' ? diePos() : null
          if (pos) Juice.onDie(pos[0], pos[1])
          else Juice.onDie()
        }
        if (GS.onFail === 'gameover') {
          GS.post('gamescroll:died', { score })
          GS.halt()
          return
        }
        __die()
      }
    }
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000)
      last = now
      try {
        if (window.PF) PF.t += dt
        if (!GS.paused && typeof tick === 'function') tick(dt)
        if (typeof draw === 'function') draw(now)
        if (window.Juice) Juice.update()
      } catch (err) {
        console.error('[gamescroll]', err)
      }
      requestAnimationFrame(loop)
    }
    requestAnimationFrame(loop)
  </script>
</body>
</html>
